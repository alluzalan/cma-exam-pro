<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060d0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">



<title>CMA Exam Pro — Intermediate MCQ Master</title>
<style>
:root{
  --bg:#060d0a; --card:#0c1912; --card2:#10231a; --line:#1c3a2b; --line2:#255239;
  --text:#eaf7f0; --mut:#8fb3a2; --dim:#5f7f70;
  --grn:#22c55e; --grn2:#4ade80; --grn-soft:#0f2e1e; --chip:#123527;
  --amber:#fbbf24; --amber-soft:#332305; --red:#f87171; --red-soft:#3a1414;
  --blue:#60a5fa; --ring:#22c55e;
  --shadow:0 8px 28px rgba(0,0,0,.45);
  --radius:16px;
}
[data-theme="light"]{
  --bg:#f2f7f3; --card:#ffffff; --card2:#f0f7f2; --line:#dcebe0; --line2:#bcd9c6;
  --text:#0b2015; --mut:#52705f; --dim:#7d978a;
  --grn:#16a34a; --grn2:#15803d; --grn-soft:#e5f6ea; --chip:#e2f3e7;
  --amber:#b45309; --amber-soft:#fdf1d7; --red:#dc2626; --red-soft:#fde8e8;
  --blue:#2563eb; --shadow:0 8px 24px rgba(23,60,40,.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,Arial,sans-serif;}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;
  border-left:1px solid var(--line); border-right:1px solid var(--line);}
#topbar{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px 10px; background:var(--bg); background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(10px);}
.brand-kicker{font-size:10px;letter-spacing:.14em;color:var(--grn);font-weight:700}
.brand-title{font-size:17px;font-weight:800;letter-spacing:-.01em}
.top-actions{display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--text);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.icon-btn svg{width:17px;height:17px}
.icon-btn:active{transform:scale(.94)}
.icon-btn.solid{background:var(--grn);border-color:var(--grn);color:#04140b}
#screen{flex:1;padding:6px 14px 96px; overflow-y:auto}
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:50;
  display:flex;justify-content:space-around;align-items:stretch;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  background:var(--card); background:color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter:blur(12px); border-top:1px solid var(--line);}
.tab{flex:1;border:0;background:none;color:var(--dim);font-size:10px;font-weight:600;display:flex;flex-direction:column;
  align-items:center;gap:4px;cursor:pointer;padding:4px 0;border-radius:12px}
.tab svg{width:20px;height:20px}
.tab.on{color:var(--grn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.card.glow{border-color:var(--line2); background:linear-gradient(160deg,var(--card2),var(--card))}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.mut{color:var(--mut)} .dim{color:var(--dim)} .grn{color:var(--grn)} .amber{color:var(--amber)} .red{color:var(--red)}
.small{font-size:12px} .tiny{font-size:11px}
h3.sec{font-size:13px;letter-spacing:.02em;margin:16px 4px 6px;color:var(--text);font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line2);background:var(--card);color:var(--mut);border-radius:999px;
  padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer}
.chip.on{background:var(--grn);border-color:var(--grn);color:#04140b}
select.sel{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line2);
  background:var(--card2);color:var(--text);font-weight:700;font-size:13px;padding:11px 16px;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grn);border-color:var(--grn);color:#04140b}
.btn.primary svg,.icon-btn svg{pointer-events:none}
.btn.ghost{background:transparent}
.btn.danger{background:var(--red-soft);border-color:transparent;color:var(--red)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.btn svg{width:15px;height:15px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .v{font-size:20px;font-weight:800}
.stat .l{font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.ring{--p:0; width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--grn) calc(var(--p)*1%), var(--line) 0);
  display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}
.ring .in{position:relative;text-align:center}
.ring .in b{font-size:17px}
.ring .in span{display:block;font-size:8px;letter-spacing:.1em;color:var(--mut)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);
  border-radius:14px;padding:12px;margin:8px 0;color:var(--text);font-size:14px;cursor:pointer;transition:.15s}
.opt .key{width:30px;height:30px;flex:0 0 auto;border-radius:50%;background:var(--chip);color:var(--text);display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:13px}
.opt.sel{border-color:var(--blue); box-shadow:0 0 0 1px var(--blue)}
.opt.good{border-color:var(--grn); background:var(--grn-soft)}
.opt.good .key{background:var(--grn);color:#04140b}
.opt.bad{border-color:var(--red); background:var(--red-soft)}
.opt.bad .key{background:var(--red);color:#2b0707}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:10px;font-weight:800;letter-spacing:.05em}
.tag.grn{background:var(--grn-soft);color:var(--grn)} .tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.red{background:var(--red-soft);color:var(--red)} .tag.dim{background:var(--chip);color:var(--mut)}
.expl{background:var(--grn-soft);border:1px solid var(--line2);border-radius:14px;padding:12px;margin-top:10px;white-space:pre-line;line-height:1.55}
.expl .h{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--grn);display:flex;gap:6px;align-items:center;margin-bottom:6px}
.note{background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 45%, transparent);border-left:4px solid var(--amber);border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:8px}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grn);border-radius:99px}
.qlist .qrow{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:8px 0;cursor:pointer}
.qlist .qrow .n{flex:0 0 34px;height:34px;border-radius:10px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.qlist .qrow p{margin:0;font-size:12.5px;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pal-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pal{height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);color:var(--mut);font-weight:700;font-size:12px;cursor:pointer;position:relative}
.pal.ans{background:var(--grn-soft);border-color:var(--grn);color:var(--grn)}
.pal.cur{outline:2px solid var(--blue)}
.pal.mk::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.timer{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;max-width:480px;background:var(--card);border:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));z-index:70;max-height:78dvh;overflow:auto;box-shadow:var(--shadow)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}
.modal h3{margin:0 0 10px;font-size:16px}
.input,textarea.input{width:100%;background:var(--card2);border:1px solid var(--line2);color:var(--text);border-radius:12px;padding:10px 12px;font-size:14px;font-family:inherit}
textarea.input{min-height:74px;resize:vertical}
.empty{text-align:center;padding:34px 18px;color:var(--mut)}
.empty .big{font-size:40px;margin-bottom:8px}
.progress-steps{margin:8px 0}
.pstep{display:flex;gap:10px;align-items:center;padding:7px 2px;font-size:13px;color:var(--dim)}
.pstep.on{color:var(--text)} .pstep.done{color:var(--grn)}
.spin{width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--grn);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
mark{background:color-mix(in srgb,var(--amber) 40%, transparent);color:inherit;border-radius:3px;padding:0 2px}
.fab-note{font-size:11px;color:var(--dim)}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.qtext{font-size:15.5px;font-weight:600;line-height:1.5;margin:2px 0 8px;white-space:pre-wrap}
.navrow{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}
.jumpbox{flex:1;text-align:center}
.jumpbox b{font-size:13px}
.correct-pill{margin-left:auto}
@media (min-width:481px){ body{background:color-mix(in srgb, var(--bg) 92%, black)} }

</style>
</head>

<script>
window.BANK={"papers":[{"code":"P6","name":"Financial Accounting","short":"Paper 6: FA","questions":[{"id":"P6-1","p":"P6","sec":"","ch":"Depreciation Accounting","q":"Which of the following is not a method of charging depreciation?","o":["Sinking Fund Method","Sum of years Digit Method","Working hours Method","Asset's Life-cycle Method"],"a":3,"v":false,"pg":1},{"id":"P6-2","p":"P6","sec":"","ch":"Accounting Fundamentals & Concepts","q":"A resource owned by the business with purpose of using it for generating future profit, is known as","o":["Capital","Asset","Liability","Surplus"],"a":1,"v":false,"pg":1},{"id":"P6-3","p":"P6","sec":"","ch":"Accounting Fundamentals & Concepts","q":"Outward Invoice issued is a source document of","o":["Purchase Book","Sales Book","Return Inward Book","Return Outward Book"],"a":1,"v":false,"pg":1},{"id":"P6-4","p":"P6","sec":"","ch":"Final Accounts & Adjustments","q":"Which of the following is of capital nature?","o":["Commission on purchases","Cost of repairs","Rent of factory","Wages paid for installation of machinery"],"a":3,"v":true,"pg":1},{"id":"P6-5","p":"P6","sec":"","ch":"Accounting Fundamentals & Concepts","q":"Which of the following is not a Fundamental Accounting Assumption?","o":["Going Concern","Consistency","Accrual","Materiality"],"a":3,"v":false,"pg":1},{"id":"P6-6","p":"P6","sec":"","ch":"Accounting Fundamentals & Concepts","q":"An obligation which may or may not materialize is a/an .","o":["Loss","Asset","Contingent Liability","None of the above"],"a":2,"v":false,"pg":1},{"id":"P6-7","p":"P6","sec":"","ch":"Inventories & Stock Valuation","q":"Which of the following is an example of Capital Expenditure?","o":["Inventory of raw materials, work-in- progress and finished goods","Insurance premium","Taxes and legal expenses","None of the above"],"a":3,"v":false,"pg":1},{"id":"P6-8","p":"P6","sec":"","ch":"Depreciation Accounting","q":"_______________is specially suited to mines, oil wells, quarries, sandpits and similar assets of a wasting character.","o":["Depletion","Depreciation","Amortisation","Dilapidation"],"a":0,"v":false,"pg":1},{"id":"P6-9","p":"P6","sec":"","ch":"Accounting Fundamentals & Concepts","q":"Which of the following account has a credit balance?","o":["Plant and Equipment A/c","Loans A/c","Purchase A/c","None of the above"],"a":1,"v":false,"pg":1},{"id":"P6-10","p":"P6","sec":"","ch":"Accounting Fundamentals & Concepts","q":"Which of the following is/are revenue expenditure?","o":["Consumable Stores","Taxes and legal expenses","Rent of factory building","All of Above"],"a":3,"v":true,"pg":1},{"id":"P6-11","p":"P6","sec":"","ch":"Ratio & Financial Analysis","q":"Which of the following purpose is served from the preparation of Trial Balance?","o":["To check the arithmetical accuracy of the recorded transactions","To ascertain the balance of any ledger account","To facilitate the preparation of final accounts promptly","All of the above"],"a":3,"v":false,"pg":1},{"id":"P6-12","p":"P6","sec":"","ch":"Accounting Fundamentals & Concepts","q":"The basic principles of concept is that business is assumed to exist for an indefinite period _______________.","o":["Going Concern","Business Entity","Money Measurement","None of the above"],"a":0,"v":false,"pg":1},{"id":"P6-13","p":"P6","sec":"","ch":"Bank Reconciliation & Rectification","q":"Purchase of a laptop for office use wrongly debited to Purchase Account. It is an error of _____________________.","o":["Omission","Commission","Principle","Misposting"],"a":2,"v":false,"pg":1},{"id":"P6-14","p":"P6","sec":"","ch":"Bills of Exchange","q":"Which of the following book is both a journal and a ledger?","o":["Cash Book","Sales Day Book","Bills Receivable Book","Journal Proper"],"a":0,"v":false,"pg":1},{"id":"P6-15","p":"P6","sec":"","ch":"Depreciation Accounting","q":"Original cost of a machine is ₹ 1,50,000, residual value ₹10,000, depreciation is charged @ 10% per annum under WDV method then depreciation for 3rd year will be_______________.","o":["if ₹ 12,240","₹ 11,340","₹ 12,150","₹ 14,000"],"a":2,"v":false,"pg":1},{"id":"P6-16","p":"P6","sec":"","ch":"Depreciation Accounting","q":"Cost of Machine B is ₹90,000, Expenses incurred at the time of purchase to be capitalized is ₹10,000. Estimated Residual Value of Machine B is ₹20,000. Expected Useful Life is 8 years.Compute the amount depreciations under SLM method.","o":["10,000","₹ 20,000","₹ 15,000","₹ 5,000"],"a":0,"v":true,"pg":2},{"id":"P6-17","p":"P6","sec":"","ch":"Accounting Fundamentals & Concepts","q":"If Capital on 01.01.2023 was ₹24,000. Capital on 31.12.2023 is was ₹12,000. Profit /(Loss) during the year was ₹6,000 and Fresh Capital introduced was ₹1,200 Then the amount of drawings was ____________.","o":["₹ 7,200","₹ 12,000","₹ 25,200","₹ 19,200"],"a":3,"v":false,"pg":2},{"id":"P6-18","p":"P6","sec":"","ch":"Final Accounts & Adjustments","q":"Journal entry of wages ₹10,000 paid for installation of machinery will be ________________.","o":["Dr.Wages A/c and Cr. Cash A/c with ₹10,000","Dr.Machinery A/c and Cr. Cash A/c with ₹10,000","Dr.Machinery repairs A/c and Cr. Cash A/c with ₹10,000","None of the above"],"a":1,"v":false,"pg":2},{"id":"P6-19","p":"P6","sec":"","ch":"Accounting Fundamentals & Concepts","q":"Credit balance of a nominal account shows ______________","o":["Expenses of the business","Loss in the business","Income in the business","Asset of the business"],"a":2,"v":false,"pg":2},{"id":"P6-20","p":"P6","sec":"","ch":"Accounting Fundamentals & Concepts","q":"Which of the following will be recorded as Contra Entry in a Cash Book?","o":["₹1,000 withdrawn from bank for personal use","Cheque of ₹2,000 received from Mr.X lodged into bank on the same day","Cheque of ₹3,000 received before from Mr.Y and now lodged into bank","A customer directly deposited ₹4,000 in the bank account of the business"],"a":2,"v":false,"pg":2},{"id":"P6-21","p":"P6","sec":"","ch":"Accounting Fundamentals & Concepts","q":"Goods purchased costing ₹60,000 and cash paid ₹45,000 after receipt of a cash discount of ₹9,000. What is the percentage of trade discount got?","o":["15%","10%","7.50%","25%"],"a":1,"v":false,"pg":2},{"id":"P6-22","p":"P6","sec":"","ch":"Final Accounts & Adjustments","q":"Which of the following errors in an error of omission?","o":["Sale ₹5,000 written in the purchase journal","Wages paid to Shyam debited to his account","The total of the sales journal has not been posted to the sales account","None of the above"],"a":2,"v":true,"pg":2},{"id":"P6-23","p":"P6","sec":"","ch":"Bank Reconciliation & Rectification","q":"A credit sale of goods to Amir, worth ₹600 was recorded in Purchase Book. In the rectification entry ___________.","o":["Amir will be debited by ₹600","Purchase will be debited by ₹600","Amir will be debited by ₹1,200","Sales will be credited by ₹1,200"],"a":2,"v":false,"pg":2},{"id":"P6-24","p":"P6","sec":"","ch":"Bank Reconciliation & Rectification","q":"Purchase of machinery worth ₹5,000 was omitted from accounts. The rectification entry is _________________.","o":["Purchase A/c will be debited","Cash A/c will be credited","Machinery A/c will be credited","None of the above"],"a":1,"v":false,"pg":2},{"id":"P6-25","p":"P6","sec":"","ch":"Final Accounts & Adjustments","q":"Goods purchased from A for ₹2,000 passed through sales book. The rectification of this error results in ________________.","o":["Decrease in Gross Profit","No effect on Gross Profit","Increase in Gross Profit","Increase in Sundry Debtors"],"a":0,"v":false,"pg":2},{"id":"P6-26","p":"P6","sec":"","ch":"Bills of Exchange","q":"The Accommodation bill is drawn","o":["to finance actual purchase or sale of goods.","to facilitate trade transmission.","when both parties are in need of funds.","None of the above"],"a":2,"v":false,"pg":2},{"id":"P6-27","p":"P6","sec":"","ch":"Joint Venture","q":"If any stock is taken by a co-venturer, it will be treated as","o":["an income of the joint venture","an expense of the = ₹8/unit; Actual Output = 950; Actual Overhead = ₹7,800. What is Overhead Cost Variance?","o":["₹200 (F)","₹200 (A)","₹400 (A)","₹400 (F)"],"a":1,"v":false,"pg":32},{"id":"P8-383","p":"P8","sec":"","ch":"Budgetary Control","q":"“Master budget” usually comprises:","o":["Sales budget only","Production budget only","All functional budgets + budgeted financial statements","Cash budget only"],"a":2,"v":false,"pg":32},{"id":"P8-384","p":"P8","sec":"","ch":"Labour & Payroll","q":"A flexible budget is useful when:","o":["Activity level is fixed and known in advance","Actual output differs from the level assumed in the budget","All costs are fixed","There is no variance between budgeted and actual"],"a":1,"v":false,"pg":32},{"id":"P8-385","p":"P8","sec":"","ch":"Budgetary Control","q":"A static budget is one which:","o":["Changes with output","Remains unchanged despite output changes","Is too flexible","Is for govt only"],"a":1,"v":false,"pg":32},{"id":"P8-386","p":"P8","sec":"","ch":"Standard Costing & Variances","q":"Flexible budget at 12,000 units: Variable cost is ₹5/unit, Fixed cost is ₹20,000; actual Variable Cost is ₹63,000, Fixed cost is ₹22,000. Calculate total cost variance.","o":["₹5,000 (A)","₹5,000 (F)","₹3,000 (A)","₹2,000 (A)"],"a":0,"v":false,"pg":32},{"id":"P8-387","p":"P8","sec":"","ch":"Budgetary Control","q":"Zero-base budgeting means:","o":["Build budget from scratch","Budget with zero profit","First year budget","Zero idle capacity"],"a":0,"v":false,"pg":32},{"id":"P8-388","p":"P8","sec":"","ch":"Budgetary Control","q":"Budget that adjusts to activity level & cost behaviour:","o":["Fixed budget","Flexible budget","Sales budget","Production budget"],"a":1,"v":false,"pg":32},{"id":"P8-389","p":"P8","sec":"","ch":"Material Costing","q":"Planned sales = 8,000; Opening stock = 500; Closing stock = 1,000. Production budget is:","o":["7,000 units","7,500 units","8,500 units","8,000 units"],"a":2,"v":false,"pg":32},{"id":"P8-390","p":"P8","sec":"","ch":"Budgetary Control","q":"Cash budget: Opening ₹5,000; Receipts ₹25,000; Payments ₹30,000. Find Closing balance.","o":["₹ 0","₹ 5,000","₹ 10,000","₹ 15,000"],"a":0,"v":false,"pg":32},{"id":"P8-391","p":"P8","sec":"","ch":"Budgetary Control","q":"Budgetary slack means:","o":["Understating revenue overstating cost","/ Overstating revenue / understating cost","Estimation error due to uncertainty","Always due to fraud"],"a":0,"v":false,"pg":32},{"id":"P8-392","p":"P8","sec":"","ch":"Material Costing","q":"Standard usage = 4 kg/unit; Expected production = 2,000 units. What is Material usage budget?","o":["8,000 kg","6,000 kg","10,000 kg","12,000 kg"],"a":0,"v":false,"pg":32}]}]}

"P6-1":"\u2705 Correct answer: (D) Asset's Life-cycle Method.\n\u2022 Recognised depreciation methods include Sinking Fund, Sum-of-Years-Digits, Working Hours (units of production), SLM, WDV and Depletion. 'Asset's Life-cycle Method' is a management/marketing concept, not a method of charging depreciation \u2014 hence it is the odd one out.",
"P6-2":"\u2705 Correct answer: (B) Asset.\n\u2022 An asset is a resource owned or controlled by the business as a result of past events, from which future economic benefits (profit) are expected.\n\u2022 Capital is the owner's contribution, a liability is an obligation, and surplus is excess of income over expenditure \u2014 none of these is a 'resource owned for generating profit'.",
"P6-3":"\u2705 Correct answer: (B) Sales Book.\n\u2022 An outward invoice is the invoice issued BY the business when it sells goods, so it is the source document for the Sales Book.\n\u2022 The Purchase Book records inward invoices received from suppliers; Returns Inward/Outward Books record goods returned.",
"P6-4":"\u2705 Correct answer: (D) Wages paid for installation of machinery.\n\u2022 Capital expenditure adds to the cost of acquiring an asset and benefits several years; installation wages are necessary to bring machinery to its working condition and are capitalised.\n\u2022 Repairs, factory rent and purchase commission here are recurring operating (revenue) items.",
"P6-5":"\u2705 Correct answer: (D) Materiality.\n\u2022 AS-1 identifies exactly three fundamental accounting assumptions: Going Concern, Consistency and Accrual.\n\u2022 Materiality is a disclosure consideration, not a fundamental assumption.",
"P6-6":"\u2705 Correct answer: (C) Contingent Liability.\n\u2022 A contingent liability is a possible obligation arising from past events whose existence will be confirmed only by the occurrence or non-occurrence of uncertain future events (e.g., disputed claims, discounted bills dishonoured).\n\u2022 It may or may not materialise, so it is disclosed by way of notes only.",
"P6-7":"\u2705 Correct answer: (D) None of the above.\n\u2022 Inventory of raw materials/WIP/finished goods, insurance premium and taxes & legal expenses are all recurring operating items whose benefit is consumed within the year \u2014 all are revenue expenditure.\n\u2022 Hence none of the options is capital expenditure.",
"P6-8":"\u2705 Correct answer: (A) Depletion.\n\u2022 The depletion method writes off wasting assets (mines, oil wells, quarries, sandpits) in proportion to the quantity extracted, so it is specially suited to assets of a wasting character.\n\u2022 Amortisation applies to intangibles; depreciation to tangible fixed assets.",
"P6-9":"\u2705 Correct answer: (B) Loans A/c.\n\u2022 A loan taken by the business is a liability and therefore carries a credit balance.\n\u2022 Plant & Equipment (asset) and Purchases (expense) carry debit balances.",
"P6-10":"\u2705 Correct answer: (D) All of Above.\n\u2022 Consumable stores, taxes & legal expenses and rent of factory building are all recurring expenses whose benefit expires in the same year \u2014 each is revenue expenditure, so all of the above apply.",
"P6-11":"\u2705 Correct answer: (D) All of the above.\n\u2022 A trial balance (1) tests the arithmetical accuracy of bookkeeping, (2) gives the balance of every ledger account at a glance, and (3) provides the convenient basis for preparing the final accounts promptly.",
"P6-12":"\u2705 Correct answer: (A) Going Concern.\n\u2022 The going concern concept assumes that the business will continue to exist for an indefinite period and has no intention to liquidate \u2014 this is why assets are carried at cost rather than break-up value.",
"P6-13":"\u2705 Correct answer: (C) Principle.\n\u2022 Buying a laptop (capital asset) but debiting it to Purchases (revenue expense) confuses capital and revenue items \u2014 an error of principle.\n\u2022 Omission = not recorded at all; commission = clerical/arithmetic mistakes; misposting = posting to the wrong account on the correct side.",
"P6-14":"\u2705 Correct answer: (A) Cash Book.\n\u2022 The cash book records transactions in the first instance from source documents (journal aspect) and simultaneously serves as the ledger accounts of cash and bank (ledger aspect) \u2014 so it is both a journal and a ledger.",
"P6-15":"Correct answer: (C) ₹12,150. Under WDV: Yr1 = 10% of 1,50,000 = 15,000 (WDV 1,35,000); Yr2 = 13,500 (WDV 1,21,500); Yr3 = 10% of 1,21,500 = ₹12,150. Residual value is ignored under the WDV method.",
"P6-16":"Correct answer: (A) ₹10,000. SLM depreciation = (Cost + capitalised expenses − residual value) ÷ life = (90,000 + 10,000 − 20,000) ÷ 8 = 80,000 ÷ 8 = ₹10,000 per annum.",
"P6-17":"Correct answer: (D) ₹19,200. Drawings = Opening capital + Fresh capital + Profit − Closing capital = 24,000 + 1,200 + 6,000 − 12,000 = ₹19,200.",
"P6-18":"\u2705 Correct answer: (B) Dr.\n\u2022 Machinery A/c and Cr.\n\u2022 Cash A/c with \u20b910,000. Wages paid for installing machinery are part of the asset's cost (capital expenditure), so Machinery A/c is debited, not Wages or Repairs A/c.",
"P6-19":"\u2705 Correct answer: (C) Income in the business.\n\u2022 Nominal accounts record incomes and expenses; a credit balance means credits (incomes) exceed debits (expenses), i.e., an income/gain.\n\u2022 A debit balance would indicate expense or loss.",
"P6-20":"\u2705 Correct answer: (C) Cheque of \u20b93,000 received before from Mr.Y and now lodged into bank.\n\u2022 A contra entry touches both cash and bank columns.\n\u2022 The cheque was earlier recorded as a cash receipt; depositing it now credits Cash and debits Bank \u2014 a contra.\n\u2022 Withdrawal for personal use is drawings; same-day lodgement and direct deposits by customers involve only the bank column.",
"P6-21":"\u2705 Correct answer: (B) 10%.\n\u2022 Cash paid 45,000 + cash discount 9,000 = 54,000 is the price after trade discount.\n\u2022 Trade discount = 60,000 \u2212 54,000 = 6,000, i.e., 6,000 \u00f7 60,000 = 10%.",
"P6-22":"\u2705 Correct answer: (C) The total of the sales journal has not been posted to the sales account.\n\u2022 An error of omission is a complete failure to record/post a transaction or posting.\n\u2022 Writing a sale in the purchase journal (wrong book) or debiting Shyam's personal account (wrong account) are errors of commission/principle, not omission.",
"P6-23":"\u2705 Correct answer: (C) Amir will be debited by \u20b91,200. The credit sale was wrongly put through the Purchase Book: Amir was never debited and Purchases was wrongly debited instead of Sales being credited.\n\u2022 Rectification: Dr Amir 1,200; Cr Purchases 600 (cancel wrong debit) and Cr Sales 600 (record the sale).",

<script>
/* Client-side marked-PDF MCQ extractor for table-layout MCQ banks (the format used by
   ICMAI-style MCQ PDFs exported from spreadsheets). Questions/options are recovered from
   column geometry; the correct answer is detected from visual markings (highlight
   annotations). Rows whose marking is missing or ambiguous are flagged for manual
   verification instead of being guessed. */
"use strict";
window.parseMarkedPDF = async function (file, stage){
  if (!window.pdfjsLib) throw new Error("PDF engine not loaded in this offline view — open the Live Preview (hosted app) to import PDFs.");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js";
  stage("read");
  const buf = await file.arrayBuffer();
  const doc = await pdfjsLib.getDocument({data: buf}).promise;
  const rowMap = new Map();
  const keyMap = new Map();      // sl -> 0-based answer code from the PDF's answer-key table
  let edges = null;              // [e1,q|o1 border, e2, e3, e4]
  stage("detect");
  for (let p = 1; p <= doc.numPages; p++){
    const page = await doc.getPage(p);
    const H = page.getViewport({scale:1}).height;
    const tc = await page.getTextContent({disableCombineTextItems:true});
    const items = tc.items.filter(it => (it.str||"").trim() !== "").map(it => ({
      s: it.str.trim(), x: it.transform[4], y: H - it.transform[5], w: it.width
    }));
    // ---- header → option column centres ----
    const hdr = items.filter(it => it.y < H*0.25);
    const optC = [];
    let qItem = null;
    for (const it of hdr){
      let mm = it.s.match(/^OPTION\s*([1-4])$/i);
      if (mm){ optC[+mm[1]-1] = it.x + it.w/2; continue; }
      if (/^OPTION$/i.test(it.s)){
        const nxt = hdr[hdr.indexOf(it)+1];
        if (nxt && /^[1-4]$/.test(nxt.s)) optC[+nxt.s-1] = (it.x + it.w/2 + nxt.x + nxt.w/2)/2;
      }
      if (/^QUESTIONS?$/i.test(it.s)) qItem = it;
    }
    const isKeyPage = hdr.some(it => /CORRECT\s*ANSWER/i.test(it.s)) || hdr.some(it => /ANSWERS TO MCQ BANK/i.test(it.s));
    if (isKeyPage){
      const slT = items.filter(it => /^\d{1,4}$/.test(it.s) && it.x < 200).sort((a,b)=>a.y-b.y);
      for (let r = 0; r < slT.length; r++){
        const y0 = r===0 ? 0 : (slT[r-1].y+slT[r].y)/2, y1 = r+1<slT.length ? (slT[r].y+slT[r+1].y)/2 : H;
        const code = items.find(it => /^([1-4])$/.test(it.s) && it.x > 400 && it.y >= y0 && it.y <= y1);
        if (code) keyMap.set(+slT[r].s, +code.s-1);
      }
      continue;
    }
    if (qItem && optC.filter(Boolean).length === 4){
      const pitch = optC[1]-optC[0];
      edges = [optC[0]-pitch/2, (optC[0]+optC[1])/2, (optC[1]+optC[2])/2, (optC[2]+optC[3])/2];
    }
    if (!edges) continue;
    const hdrY = qItem ? qItem.y : null;
    const [e1, e2, e3, e4] = edges;
    // ---- rows begin at numeric SL tokens in the left margin ----
    const sls = items.filter(it => /^\d{1,4}$/.test(it.s) && it.x < e1 - 40).sort((a,b)=>a.y-b.y);
    for (let r = 0; r < sls.length; r++){
      const sl = sls[r];
      const y0 = r===0 ? (hdrY!==null ? hdrY+6 : sl.y-30) : (sls[r-1].y+sl.y)/2;
      const y1 = r+1 < sls.length ? (sl.y+sls[r+1].y)/2 : H;
      const row = {sl:+sl.s, q:[], opts:[[],[],[],[]], marks:new Set(), page:p, _y0:y0, _y1:y1};
      for (const it of items){
        if (it === sl || it.y < y0 || it.y > y1) continue;
        for (const seg of splitRun(it, [e1,e2,e3,e4])){
          const c = seg.col;
          if (c === -1) continue;                      // left margin noise
          if (c === 0) row.q.push([it.y, seg.x, seg.s]);
          else row.opts[c-1].push([it.y, seg.x, seg.s]);
        }
      }
      const score = row.marks.size === 1 ? 2 : row.marks.size === 0 ? 0 : 1;
      const ex = rowMap.get(row.sl);
      const exScore = ex ? (ex.marks.size === 1 ? 2 : ex.marks.size === 0 ? 0 : 1) : -1;
      if (score >= exScore) rowMap.set(row.sl, row);
    }
    // ---- highlight annotations = visual answer markings ----
    stage("marks");
    const anns = await page.getAnnotations();
    for (const a of anns){
      if ((a.subtype||"").toLowerCase() !== "highlight") continue;
      const yc = H - (a.rect[1]+a.rect[3])/2, xc = (a.rect[0]+a.rect[2])/2;
      const row = [...rowMap.values()].find(rr => rr.page===p && yc >= rr._y0 && yc <= rr._y1);
      if (!row) continue;
      if (xc >= e1-4 && xc < e2) row.marks.add(0);
      else if (xc >= e2-4 && xc < e3) row.marks.add(1);
      else if (xc >= e3-4 && xc < e4) row.marks.add(2);
      else if (xc >= e4-4) row.marks.add(3);
    }
  }
  stage("organize");
  const seen = new Set(); const questions = []; let marked = 0;
  for (const r of [...rowMap.values()].sort((a,b)=>a.sl-b.sl)){
    const key = r.sl + "@" + r.page;
    if (seen.has(key)) continue; seen.add(key);
    const join = arr => arr.sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(t=>t[2]).join(" ").replace(/\s+/g," ").trim();
    let q = join(r.q);
    if (!q) q = "(Question text missing in source PDF - review & edit)";
    const opts = r.opts.map(join);
    if (!opts.some(Boolean)) continue;
    while (opts.length < 4) opts.push("");
    let a = r.marks.size === 1 ? [...r.marks][0] : null;
    let v = a === null;
    const km = keyMap.get(r.sl);
    if (km !== undefined){
      if (a === null){ a = km; v = false; }        // answer key is explicit
      else if (km !== a){ v = true; }              // marking vs key conflict → verify
    }
    if (a !== null) marked++;
    questions.push({q, o:opts, a, v, page:r.page, sl:r.sl,
      norm: q.toLowerCase().replace(/[^a-z0-9]+/g," "), ch:"", sec:""});
  }
  stage("ready");
  return {fileName: file.name, questions, marked};
};

/* Split a text run that spans several table columns at the column borders,
   snapping each split to the nearest space so words stay intact. */
function splitRun(it, edges){
  const x1 = it.x + it.w;
  const cross = edges.filter(e => e > it.x + 6 && e < x1 - 6);
  if (!cross.length){
    return [{s: it.s, x: it.x, col: colOf(it.x + it.w/2, edges)}];
  }
  const parts = [];
  let text = it.s, xStart = it.x, xEnd = x1;
  for (const e of cross){
    const frac = (e - xStart) / (xEnd - xStart);
    const target = Math.round(frac * text.length);
    let best = -1, bd = 1e9;
    for (let i = 0; i < text.length; i++) if (text[i] === " "){
      const d = Math.abs(i - target);
      if (d < bd){ bd = d; best = i; }
    }
    if (best < 0) best = target;
    const left = text.slice(0, best), right = text.slice(best).trim();
    parts.push({s: left.trim(), x: xStart, col: colOf((xStart+e)/2, edges)});
    text = right; xStart = e;
  }
  parts.push({s: text.trim(), x: xStart, col: colOf((xStart+x1)/2, edges)});
  return parts.filter(pt => pt.s);
}
function colOf(xc, edges){
  const [e1,e2,e3,e4] = edges;
  if (xc < e1) return 0;
  if (xc < e2) return 1;
  if (xc < e3) return 2;
  if (xc < e4) return 3;
  return 4;
}

</script>

/* ---------- data access ---------- */
let IDX = {};
function rebuildIndex(){
  IDX = {};
  for (const p of papers()) for (const q of p.questions) IDX[q.id] = q;
}
function papers(){
  return window.BANK.papers.concat(S.imports.map(i => ({code:i.code, name:i.name, short:i.short, imported:true, questions:i.questions})));
}
function Q(id){
  const b0 = IDX[id]; if (!b0) return null;
  const b = (window.EXPL && EXPL[id]) ? Object.assign({}, b0, {expl: EXPL[id]}) : b0;
  const e = S.edits[id]; if (!e) return b;
  return Object.assign({}, b, { q: e.q ?? b.q, o: e.o || b.o, a: (e.a !== undefined && e.a !== null) ? e.a : b.a, v: e.v !== undefined ? e.v : b.v });
}
const allQ = () => papers().flatMap(p => p.questions);
const chaptersOf = (code, sec) => { const p = papers().find(x=>x.code===code); if(!p) return []; const qs = (sec && sec!=="ALL") ? p.questions.filter(q=>(q.sec||"")===sec) : p.questions; return [...new Set(qs.map(q=>q.ch))]; };
const needsVerify = () => allQ().filter(q => Q(q.id).v);

/* ---------- stats ---------- */
const mastered = id => (S.pr[id]||{}).ok >= 2;
function totals(){
  const qs = allQ(); let at=0, ok=0, solved=0, mast=0;
  for (const q of qs){ const p = S.pr[q.id]; if (p && p.at){ solved++; at+=p.at; ok+=p.ok; if (mastered(q.id)) mast++; } }
  return { total: qs.length, at, ok, solved, mast, acc: at? Math.round(100*ok/at):0, mocks: S.mocks.length, sessions: S.sessions||0,
    avgMock: S.mocks.length? Math.round(S.mocks.reduce((a,m)=>a+m.pct,0)/S.mocks.length):0 };
}
function chapterPerf(){
  const map = {};
  for (const q of allQ()){ const p = S.pr[q.id]; if (!p || !p.at) continue;
    const key = (q.p==="P7" ? (q.sec||"Income Tax")+" › " : "") + q.ch;
    const m = map[key] || (map[key] = {at:0, ok:0, paper:q.p});
    m.at += p.at; m.ok += p.ok; }
  return map;
}

/* ---------- shared bits ---------- */
function paperChips(sel, onPick, includeAll=true){
  const w = h(`<div class="chips"></div>`);
  if (includeAll) w.appendChild(chip("ALL","All Papers", sel==="ALL", onPick));
  for (const p of papers()) w.appendChild(chip(p.code, p.short || p.code, sel===p.code, onPick));
  return w;
}
function chip(id,label,on,onPick){
  const c = h(`<button class="chip ${on?"on":""}">${esc(label)}</button>`);
  c.onclick = () => onPick(id); return c;
}
function studyList(f){
  let qs = allQ();
  if (f.paper !== "ALL") qs = qs.filter(q=>q.p===f.paper);
  if (f.sec && f.sec!=="ALL") qs = qs.filter(q=>(q.sec||"")===f.sec);
  if (f.ch && f.ch!=="ALL") qs = qs.filter(q=>q.ch===f.ch);
  if (f.scope==="BM") qs = qs.filter(q=>S.bm[q.id]);
  if (f.scope==="DF") qs = qs.filter(q=>S.df[q.id]);
  if (f.scope==="NV") qs = qs.filter(q=>Q(q.id).v);
  if (f.scope==="UA") qs = qs.filter(q=>!S.pr[q.id] || !S.pr[q.id].at);
  return qs;
}
function optRow(q, i, cls, extra){
  return `<button class="opt ${cls||""}" data-i="${i}"><span class="key">${"ABCD"[i]}</span><span>${esc(q.o[i])}</span>${extra||""}</button>`;
}
function record(qid, ok){
  const p = S.pr[qid] || (S.pr[qid] = {at:0, ok:0});
  p.at++; if (ok) p.ok++; p.last = Date.now();
  const t = today();
  if (S.streak.last !== t){
    const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
    S.streak.days = (S.streak.last === y) ? S.streak.days+1 : 1;
    S.streak.last = t;
  }
  save();
}

function scrStudy(m){

  m.appendChild(paperChips(f.paper, p => { f.paper=p; f.ch="ALL"; f.idx=0; render(); }));
  if (f.paper==="P7" || f.paper==="ALL"){
    const s = h(`<div class="chips" style="margin-top:6px"></div>`);
    for (const sec of ["ALL","Income Tax","GST","Customs"]) s.appendChild(chip(sec, sec==="ALL"?"All Sections":sec, f.sec===sec, v=>{f.sec=v;f.ch="ALL";f.idx=0;render();}));
    m.appendChild(s);
  }
  const chWrap = h(`<div style="margin:8px 0"></div>`);
  const sel = h(`<select class="sel"><option value="ALL">All Chapters</option></select>`);
  const pools = f.paper==="ALL" ? papers() : papers().filter(p=>p.code===f.paper);
  const secFilterActive = f.sec && f.sec!=="ALL";
  const chs = [...new Set(pools.flatMap(p => p.questions.filter(q => (p.code!=="P7" || !secFilterActive) ? true : (q.sec||"")===f.sec).map(q=>q.ch)))];
  for (const c of chs) sel.appendChild(h(`<option value="${esc(c)}" ${f.ch===c?"selected":""}>${esc(c)}</option>`));
  sel.onchange = () => { f.ch = sel.value; f.idx=0; render(); };
  chWrap.appendChild(sel);
  m.appendChild(chWrap);
  const scopeRow = h(`<div class="chips"></div>`);
  for (const [id,l] of [["ALL","All"],["BM","🔖 Bookmarked"],["DF","⚠️ Difficult"],["NV","Verify"],["UA","Unattempted"]])
    scopeRow.appendChild(chip(id,l,f.scope===id,v=>{f.scope=v;f.idx=0;render();}));
  m.appendChild(scopeRow);

  const qs = studyList(f);
  if (!qs.length){ m.appendChild(h(`<div class="empty"><div class="big">📭</div>No questions match these filters.</div>`)); return; }
  f.idx = Math.min(Math.max(f.idx,0), qs.length-1);
  const q = Q(qs[f.idx].id);
  const pr = S.pr[q.id] || {at:0};
  const card = h(`
   <div class="card glow">
     <div class="qmeta">
       <span class="tag grn">Q${q.id.split("-")[1]}</span>
       <span class="tag dim">${esc(q.p)}</span>
       ${q.sec?`<span class="tag dim">${esc(q.sec)}</span>`:""}
       <span class="icon-btn" id="bmB" style="width:32px;height:32px;margin-left:auto;color:${S.bm[q.id]?"var(--grn)":"var(--dim)"}">${I.saved}</span>
       <span class="icon-btn" id="dfB" style="width:32px;height:32px;color:${S.df[q.id]?"var(--amber)":"var(--dim)"}">${I.warn}</span>
       <span class="icon-btn" id="edB" style="width:32px;height:32px;color:var(--dim)">${I.edit}</span>
     </div>
     <div class="tiny mut" style="margin-bottom:6px">${esc(q.ch)} · ${pr.at?`attempted ${pr.at}×`:"not attempted"}</div>
     <div class="qtext">${esc(q.q)}</div>
     ${q.o.map((o,i)=>optRow(q,i, q.a===i?"good":"", q.a===i?`<span class="tag grn correct-pill">${I.check} CORRECT</span>`:"")).join("")}
     ${q.a===null?`<div class="note">${I.warn} Correct answer not confirmed yet — open <b>Verification</b> to set it.</div>`:""}
     ${q.expl?`<div class="expl"><div class="h">💡 EXPLANATION & EXAM NOTES</div>${esc(q.expl)}</div>`:`<div class="expl"><div class="h">💡 EXPLANATION</div><span class="small mut">No explanation available for this question in the source PDF.</span></div>`}
     <div class="navrow">
       <button class="btn" id="prevB" ${f.idx===0?"disabled style='opacity:.4'":""}>${I.left} Previous</button>

function jumpModal(qs, f){

function startList(ids, title){
  if (!ids.length) return toast("Nothing here yet");

const shuffle = a => { a=a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]];} return a; };

function startSession(cfg){
  SES = Object.assign({idx:0, picked:{}, submitted:{}, marked:{}, start:Date.now()}, cfg);
  if (cfg.mode==="mock") SES.tEnd = Date.now() + cfg.mins*60000;
  V.tab = cfg.mode==="mock" ? "mock" : "session";
  render();
}

/* ================= PRACTICE SESSION ================= */
function scrSession(m){
  if (!SES) { m.appendChild(h(`<div class="empty"><div class="big">🎯</div>No active session.</div>`)); return; }
  const q = Q(SES.qs[SES.idx]);
  const done = SES.submitted[SES.idx];
  const pick = SES.picked[SES.idx];
  m.appendChild(h(`
   <div class="row spread small mut" style="padding:6px 2px">
     <span><b class="grn">${esc(SES.title||"Practice")}</b> · Question ${SES.idx+1} of ${SES.qs.length}</span>
     <span>${Object.keys(SES.submitted).length} answered</span>
   </div>`));
  const card = h(`
   <div class="card glow">
     <div class="qmeta"><span class="tag grn">Q${q.id.split("-")[1]}</span><span class="tag dim">${esc(q.p)}</span><span class="tag dim">${esc(q.ch)}</span></div>
     <div class="qtext">${esc(q.q)}</div>
     ${q.o.map((o,i)=>{
        let cls = ""; let extra = "";
        if (done){ if (i===q.a){cls="good";extra=`<span class="tag grn correct-pill">${I.check} CORRECT</span>`;} else if (i===pick){cls="bad";extra=`<span class="tag red correct-pill">${I.x} YOUR PICK</span>`;} }
        else if (i===pick) cls="sel";
        return optRow(q,i,cls,extra);
     }).join("")}
     ${done ? (q.expl?`<div class="expl"><div class="h">💡 EXPLANATION</div>${esc(q.expl)}</div>`:`<div class="expl"><div class="h">💡 EXPLANATION</div><span class="small mut">No explanation in source PDF.</span></div>`) : ""}
     <div class="navrow">
       <button class="btn" id="sPrev" ${SES.idx===0?"disabled style='opacity:.4'":""}>${I.left}</button>
       ${done ? `<button class="btn primary block" id="sNext">${SES.idx===SES.qs.length-1?"Finish Session":"Next Question"} ${I.right}</button>`
              : `<button class="btn primary block" id="sSubmit" ${pick===undefined?"disabled style='opacity:.4'":""}>Submit Answer</button>`}
     </div>
   </div>`);
  m.appendChild(card);
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => { if (SES.submitted[SES.idx]) return; SES.picked[SES.idx] = +b.dataset.i; render(); });
  const sb = $("#sSubmit"); if (sb) sb.onclick = () => {
    if (SES.picked[SES.idx]===undefined) return;
    SES.submitted[SES.idx] = 1;
    record(q.id, SES.picked[SES.idx]===q.a);
    render();
  };
  $("#sPrev").onclick = () => { SES.idx--; render(); };
  const nx = $("#sNext"); if (nx) nx.onclick = () => {
    if (SES.idx === SES.qs.length-1) return finishSession();
    SES.idx++; render();
  };
}
function finishSession(){
  let ok=0, bad=0;
  SES.qs.forEach((id,i)=>{ if (SES.submitted[i]){ (SES.picked[i]===Q(id).a)?ok++:bad++; } });
  const res = {ok, bad, skip:SES.qs.length-ok-bad, total:SES.qs.length};
  lastResult = {mode:"practice", title:SES.title, ...res, ids:SES.qs, picked:SES.picked, submitted:SES.submitted};
  S.sessions = (S.sessions||0)+1; save();
  SES = null; V.tab = "results"; render();
}

function mockPool(c){
  let qs = studyList({paper:c.paper, ch:c.ch, sec:c.sec, scope:"ALL"});
  if (c.diff==="hard") qs = qs.filter(q=>S.df[q.id]);
  if (c.diff==="unm") qs = qs.filter(q=>!mastered(q.id));
  return qs;
}

/* ================= MOCK RUN ================= */
function scrMockRun(m){
  if (!SES || SES.mode!=="mock") { m.appendChild(h(`<div class="empty"><div class="big">🧪</div>No mock running.</div>`)); return; }
  const q = Q(SES.qs[SES.idx]);
  const remain = Math.round((SES.tEnd-Date.now())/1000);
  if (remain<=0){ submitMock(); return; }
  if (!SES.timer){
    SES.timer = setInterval(()=>{ const el=$("#timer"); if(!el){return;} const r=Math.round((SES.tEnd-Date.now())/1000);
      el.textContent = fmtT(r); el.parentElement.classList.toggle("low", r<60);
      if (r<=0){ clearInterval(SES.timer); SES.timer=null; submitMock(); } }, 500);
  }
  m.appendChild(h(`
   <div class="row spread" style="padding:6px 2px">
     <button class="btn sm ghost" id="mBack">${I.left}</button>
     <b class="small">Q${SES.idx+1} / ${SES.qs.length}</b>
     <span class="timer small">${I.timer} <span id="timer">${fmtT(remain)}</span></span>
   </div>`));
  m.appendChild(h(`
   <div class="card glow">
     <div class="qmeta"><span class="tag dim">${esc(q.p)}</span><span class="tag dim">${esc(q.ch)}</span>
        <button class="btn sm ${SES.marked[SES.idx]?"":"ghost"}" id="mkB" style="margin-left:auto">${I.flag} ${SES.marked[SES.idx]?"Marked":"Mark for Review"}</button></div>
     <div class="qtext">${esc(q.q)}</div>
     ${q.o.map((o,i)=>optRow(q,i, SES.picked[SES.idx]===i?"sel":"")).join("")}

       <button class="btn" id="mPrev" ${SES.idx===0?"disabled style='opacity:.4'":""}>${I.left} Previous</button>
       <button class="btn" id="palB">☰ Palette</button>
       <button class="btn primary" id="mNext">${SES.idx===SES.qs.length-1?"Submit":"Next"} ${I.right}</button>
     </div>
   </div>`));
  m.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ SES.picked[SES.idx]=+b.dataset.i; render(); });
  $("#mBack").onclick = () => confirmModal("Exit mock? Progress will be submitted.", ()=>submitMock());
  $("#mkB").onclick = () => { SES.marked[SES.idx] = !SES.marked[SES.idx]; render(); };
  $("#mPrev").onclick = () => { SES.idx--; render(); };
  $("#mNext").onclick = () => { if (SES.idx===SES.qs.length-1) confirmModal("Submit the mock exam now?", ()=>submitMock()); else { SES.idx++; render(); } };
  $("#palB").onclick = () => palette();
}
function palette(){
  const sheet = h(`<div class="overlay"><div class="sheet">
    <div class="row spread"><b>Question Palette</b><button class="icon-btn" id="pX">${I.x}</button></div>
    <div class="tiny mut" style="margin:6px 0 12px">Green = answered · dot = marked for review</div>
    <div class="pal-grid">${SES.qs.map((id,i)=>`<button class="pal ${SES.picked[i]!==undefined?"ans":""} ${i===SES.idx?"cur":""} ${SES.marked[i]?"mk":""}" data-i="${i}">${i+1}</button>`).join("")}</div>
    <button class="btn primary block" id="pSub" style="margin-top:14px">Submit Test</button>
  </div></div>`);
  $("#modalRoot").appendChild(sheet);
  sheet.querySelector("#pX").onclick = () => sheet.remove();
  sheet.onclick = e => { if (e.target===sheet) sheet.remove(); };
  sheet.querySelectorAll(".pal").forEach(b=>b.onclick=()=>{ SES.idx=+b.dataset.i; sheet.remove(); render(); });
  sheet.querySelector("#pSub").onclick = () => { sheet.remove(); confirmModal("Submit the mock exam now?", ()=>submitMock()); };
}
function submitMock(){
  if (!SES) return;
  if (SES.timer){ clearInterval(SES.timer); SES.timer=null; }
  const taken = Math.round((Date.now()-SES.start)/1000);
  let ok=0,bad=0,un=0; const per={};
  SES.qs.forEach((id,i)=>{
    const q=Q(id); const p=SES.picked[i];
    if (p===undefined) un++;
    else { const good = p===q.a; good?ok++:bad++; record(id, good); }
    const key=(q.p==="P7"?(q.sec||"Income Tax")+" › ":"")+q.ch;
    const pm = per[key]||(per[key]={t:0,ok:0}); pm.t++; if (p!==undefined && p===q.a) pm.ok++;
  });
  const pct = Math.round(100*ok/SES.qs.length);
  const res = {mode:"mock", title:SES.title, ok, bad, un, total:SES.qs.length, pct, acc: (ok+bad)?Math.round(100*ok/(ok+bad)):0, taken, per, ids:SES.qs, picked:SES.picked, marked:SES.marked};
  S.mocks.push({date:Date.now(), pct, ok, total:SES.qs.length, taken});
  S.sessions = (S.sessions||0)+1; save();
  lastResult = res; SES=null; V.tab="results"; render();
}

/* ================= IMPORT ================= */
function scrImport(m){
  m.appendChild(h(`
   <div class="card glow">
     <div class="row"><span class="icon-btn solid">${I.up}</span>
       <div><b>Import Marked MCQ PDF</b><div class="small mut">Upload your CMA Intermediate MCQ bank. Correct answers are detected from highlights, ticks & circles in the PDF.</div></div></div>
     <input type="file" id="pdfIn" accept="application/pdf" style="display:none">
     <button class="btn primary block" id="pickB" style="margin-top:12px">Choose PDF from Files</button>
   </div>
   <div class="card"><b class="small">How extraction works</b>
     <div class="progress-steps" id="steps">
       ${["Reading PDF…","Detecting questions…","Detecting answer markings…","Organizing questions…","Ready!"].map(s=>`<div class="pstep" data-s="${s}">○ &nbsp;${s}</div>`).join("")}
     </div>
   </div>
   <div class="card"><b class="small">Privacy</b><div class="tiny mut">Processing happens on-device. Your PDFs and progress never leave this phone.</div></div>
   <div id="importOut"></div>`));
  $("#pickB").onclick = () => $("#pdfIn").click();
  $("#pdfIn").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    setStep(0,"on");
    try {
      const res = await window.parseMarkedPDF(f, (stage, extra) => {
        const idx = {"read":0,"detect":1,"marks":2,"organize":3,"ready":4}[stage];
        for (let i=0;i<idx;i++) setStep(i,"done");
        setStep(idx, idx===4?"done":"on");
        if (extra) $("#importOut").innerHTML = "";
      });
      for (let i=0;i<5;i++) setStep(i,"done");
      const existing = new Set(allQ().map(q=>norm(q.q)));
      res.dupIds = new Set(res.questions.filter(q=>existing.has(q.norm)).map(q=>norm(q.q)));
      res.dups = [...res.dupIds];
      showImportResult(res);
    } catch(err){
      console.error(err);
      setStep(0,"");
      $("#importOut").innerHTML = `<div class="card" style="border-color:var(--red)"><b class="red small">Could not parse this PDF.</b><div class="tiny mut">${esc(err.message||String(err))}</div><div class="tiny mut" style="margin-top:6px">You can retry, or fix the source file. No incorrect questions were created.</div><button class="btn sm" style="margin-top:8px" onclick="document.querySelector('#pickB').click()">Retry</button></div>`;
    }
  };
}
function setStep(i, cls){
  const el = $$("#steps .pstep")[i]; if (!el) return;
  el.className = "pstep " + cls;
  const icon = cls==="done" ? "✓" : cls==="on" ? '<span class="spin"></span>' : "○";
  el.innerHTML = icon + " &nbsp;" + el.dataset.s;
}
function showImportResult(res){
  const out = $("#importOut");
  const dupN = res.dups.length;
  out.innerHTML = "";
  out.appendChild(h(`
   <div class="card glow">
     <b class="grn">Extraction complete 🎉</b>
     <div class="stat-grid" style="margin-top:10px">
       <div class="stat"><div class="v">${res.questions.length}</div><div class="l">Questions</div></div>
       <div class="stat"><div class="v grn">${res.marked}</div><div class="l">Marked ✓</div></div>
       <div class="stat"><div class="v amber">${res.questions.length-res.marked}</div><div class="l">To verify</div></div>
     </div>
     ${dupN?`<div class="note" style="margin-top:10px">${dupN} duplicate question${dupN>1?"s":""} already present in your bank detected.</div>`:""}
   </div>
   <div class="card"><b class="small">How should this set be stored?</b>
     <div class="row" style="gap:10px;margin-top:10px">
       <button class="btn primary block" id="mSep">Keep separate set</button>
       ${dupN?`<button class="btn block" id="mMerge">Merge (skip dups)</button>`:""}
     </div>
   </div>`));
  const finish = merge => {
    let qs = res.questions;
    if (merge) qs = qs.filter(q=>!res.dupIds.has(q.norm));
    const code = "IMP" + (S.imports.length+1);
    S.imports.push({code, name: res.fileName.replace(/\.pdf$/i,""), short: code, questions: qs.map((q,i)=>({id:`${code}-${i+1}`, p:code, sec:q.sec||"", ch:q.ch||"Imported", q:q.q, o:q.o, a:q.a, v:q.a===null, pg:q.page}))});
    save(); rebuildIndex();
    toast(`Imported ${qs.length} questions as ${code}`);
    const nv = S.imports[S.imports.length-1].questions.filter(q=>q.v).length;
    V.tab = nv ? "verify" : "home"; render();
  };
  $("#mSep").onclick = () => finish(false);
  if ($("#mMerge")) $("#mMerge").onclick = () => finish(true);
}

/* ---------- modals / toast ---------- */
function openModal(html, wire){
  closeModal();
  const ov = h(`<div class="overlay"><div class="modal">${html}</div></div>`);
  $("#modalRoot").appendChild(ov);
  ov.onclick = e => { if (e.target===ov) closeModal(); };
  if (wire) wire(ov);
}
function closeModal(){ $("#modalRoot").innerHTML = ""; }
function confirmModal(msg, onYes){
  openModal(`<h3>Confirm</h3><div class="small mut">${esc(msg)}</div>
   <div class="row" style="margin-top:14px"><button class="btn block" id="cN">Cancel</button><button class="btn primary block" id="cY">Yes</button></div>`,
   r=>{ r.querySelector("#cN").onclick=closeModal; r.querySelector("#cY").onclick=()=>{closeModal();onYes();}; });
}
function editModal(id){
  const q = Q(id);
  openModal(`<h3>Edit / correct question</h3>
    <label class="tiny mut">Question text</label><textarea class="input" id="eQ">${esc(q.q)}</textarea>
    ${q.o.map((o,i)=>`<label class="tiny mut" style="display:block;margin-top:8px">Option ${"ABCD"[i]}
      <input class="input" id="eO${i}" value="${esc(o)}"></label>`).join("")}
    <label class="tiny mut" style="display:block;margin-top:8px">Correct answer</label>
    <select class="sel" id="eA"><option value="">— unverified —</option>${[0,1,2,3].map(i=>`<option value="${i}" ${q.a===i?"selected":""}>${"ABCD"[i]}</option>`).join("")}</select>
    <div class="row" style="margin-top:14px"><button class="btn block" id="eC">Cancel</button><button class="btn primary block" id="eS">Save</button></div>`,
   r=>{
     r.querySelector("#eC").onclick = closeModal;
     r.querySelector("#eS").onclick = () => {
       const aV = r.querySelector("#eA").value;
       S.edits[id] = { q: r.querySelector("#eQ").value, o: [0,1,2,3].map(i=>r.querySelector("#eO"+i).value),
         a: aV===""?null:+aV, v: aV===""?1:0 };
       save(); rebuildIndex(); closeModal(); render(); toast("Question updated");
     };
   });
}
let toastT=null;
function toast(msg){
  let t = $("#toastEl");
  if (!t){ t = h(`<div id="toastEl" style="position:fixed;bottom:86px;left:50%;transform:translateX(-50%);z-index:90;background:var(--grn);color:#04140b;font-weight:700;font-size:12.5px;padding:9px 16px;border-radius:99px;box-shadow:var(--shadow);pointer-events:none"></div>`); document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toastT); toastT = setTimeout(()=>t.style.opacity=0, 2200);
  t.style.transition="opacity .4s";
}

/* ---------- search ---------- */
function openSearch(){
  const root = $("#searchRoot");
  root.innerHTML = "";
  const ov = h(`<div class="overlay" style="align-items:flex-start"><div class="modal" style="border-radius:0 0 20px 20px;max-height:92dvh">
    <div class="row"><input class="input" id="sIn" placeholder="Search questions, options, topics…"><button class="icon-btn" id="sX">${I.x}</button></div>
    <div id="sRes" style="margin-top:10px"></div></div></div>`);
  root.appendChild(ov);
  ov.querySelector("#sX").onclick = () => root.innerHTML="";
  const inp = ov.querySelector("#sIn"); inp.focus();
  inp.oninput = () => {
    const term = norm(inp.value); const box = ov.querySelector("#sRes"); box.innerHTML="";
    if (term.length<2) return;
    const hits = allQ().filter(q=>{
      const qe = Q(q.id);
      return norm(qe.q).includes(term) || qe.o.some(o=>norm(o).includes(term)) || norm(q.ch).includes(term) || norm(q.sec||"").includes(term);
    }).slice(0,60);
    if (!hits.length){ box.innerHTML = `<div class="empty small">No matches.</div>`; return; }
    for (const q0 of hits){
      const q = Q(q0.id);
      const row = h(`<div class="qrow"><span class="n">${q.id.split("-")[1]}</span><p>${esc(q.q.slice(0,110))}</p><span class="tag dim">${esc(q.p)}</span></div>`);
      row.onclick = () => { root.innerHTML=""; V.tab="study"; V.study.paper=q.p; V.study.ch=q.ch; V.study.scope="ALL";
        const qs = studyList(V.study); V.study.idx = Math.max(0, qs.findIndex(x=>x.id===q.id)); render(); };
      box.appendChild(row);
    }
  };
}

/* ---------- boot ---------- */
document.documentElement.dataset.theme = S.theme;
$("#btnTheme").onclick = () => { S.theme = S.theme==="dark"?"light":"dark"; document.documentElement.dataset.theme=S.theme; save(); };
$("#btnSearch").onclick = openSearch;
$("#btnImport").onclick = () => { V.tab="import"; render(); };
rebuildIndex();
render();
try { if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{}); } catch(e){}

</script>
